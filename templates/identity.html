{% extends 'base.html' %}{% block content %}<div class="identity-card"><span class="eyebrow">MOCK IDENTITY PROVIDER</span><h1>模拟学校身份认证</h1><p>请选择角色。仅用于本地课程演示，演示密码为 <code>Demo@2026</code>。</p>{% if error %}<div class="message error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<label for="username">模拟账号</label><select id="username" name="username">{% for a in accounts %}<option value="{{ a.username }}">{{ a.display_name }} · {{ a.username }}</option>{% endfor %}</select><label for="password">演示密码</label><input id="password" name="password" type="password" required autocomplete="current-password"><button class="button full">认证并返回系统</button></form><p class="fine">模拟提供方校验身份。业务系统接收带时效和一次性校验的身份断言。</p></div>{% endblock %}
