{% extends 'base.html' %}
{% block content %}
<div class="identity-card">
  <h1>演示账号登录</h1>
  {% if public_demo %}
  <p>公开学生和教师账号使用 <code>Demo@2026</code>。专用账号和其他岗位使用各自的密码。</p>
  {% else %}
  <p>请选择模拟账号，演示密码为 <code>Demo@2026</code>。</p>
  {% endif %}
  {% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="username">账号</label>
    <select id="username" name="username" required autocomplete="username">
      <option value="">请选择账号</option>
      {% for a in accounts %}
      <option value="{{ a.username }}"{% if a.username == username %} selected{% endif %}>{{ a.display_name }} · {{ a.roles.all|join:"、" }} · {{ a.username }}</option>
      {% endfor %}
    </select>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
    <button class="button full">登录</button>
  </form>
  <p><a href="{% url 'access' %}">返回访问入口</a></p>
</div>
{% endblock %}
