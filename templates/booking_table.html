<div class="table-wrap"><table><thead><tr><th>预约资源</th><th>申请人</th><th>使用时段</th><th>状态</th><th></th></tr></thead><tbody>{% for b in bookings %}<tr><td><strong>{{ b.resource.name }}</strong><small>{{ b.resource.code }} · {{ b.resource.lab.code }}</small></td><td>{{ b.applicant.display_name }}</td><td>{{ b.starts_at|date:'m-d H:i' }} 至 {{ b.ends_at|date:'H:i' }}</td><td><span class="badge {{ b.status|lower }}">{{ b.get_status_display }}</span></td><td><a href="{% url 'booking' b.pk %}">查看 →</a></td></tr>{% empty %}<tr><td colspan="5" class="empty-state">当前没有符合条件的预约记录。</td></tr>{% endfor %}</tbody></table></div>
