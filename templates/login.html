{% extends 'base.html' %}
{% block content %}
{% if error %}<div class="message error" role="alert">{{ error }}</div>{% endif %}
<div class="login-layout">
  <section class="login-intro"><h1>校园实验资源中心</h1><p>查询教室与设备，预约实验资源，跟进使用安排。</p></section>
  <section class="login-card">
    <h2>{% if demo %}演示账号登录{% else %}统一身份登录{% endif %}</h2>
    <form method="post">{% csrf_token %}<button class="button full">{% if demo %}选择演示账号{% else %}进入学校统一身份入口{% endif %}</button></form>
    {% if demo %}<p><a href="{% url 'access' %}">查看其他访问方式</a></p>{% endif %}
  </section>
</div>
{% endblock %}
