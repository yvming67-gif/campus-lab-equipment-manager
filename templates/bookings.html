{% extends 'base.html' %}{% block content %}<div class="page-top"><div><div class="eyebrow">RESERVATION & USAGE</div><h1>预约与使用记录</h1><p>普通用户查看本人记录，管理员按实验室授权范围查看。</p></div><a class="button" href="{% url 'resources' %}">新建预约 ↗</a></div><form class="filter-row panel" method="get"><div><label for="filter-q">资源、编号或申请人</label><input id="filter-q" name="q" value="{{ request.GET.q }}" placeholder="搜索记录"></div><div><label for="filter-lab">实验室</label><select id="filter-lab" name="lab"><option value="">全部</option>{% for l in labs %}<option value="{{ l.pk }}" {% if request.GET.lab == l.pk|stringformat:'s' %}selected{% endif %}>{{ l.name }}</option>{% endfor %}</select></div><div><label for="filter-day">日期</label><input type="date" id="filter-day" name="day" value="{{ request.GET.day }}"></div><div><label for="filter-status">状态</label><select id="filter-status" name="status"><option value="">全部状态</option>{% for code,name in statuses %}<option value="{{ code }}" {% if request.GET.status == code %}selected{% endif %}>{{ name }}</option>{% endfor %}</select></div><button class="button">筛选</button></form>{% include 'booking_table.html' %}{% include 'pagination.html' %}{% endblock %}
