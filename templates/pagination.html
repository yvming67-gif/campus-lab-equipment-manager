{% if page %}<nav class="section-heading pagination" aria-label="{{ pagination_label|default:'列表分页' }}"><span>共{{ page.paginator.count }}项 · 第{{ page.number }}/{{ page.paginator.num_pages }}页</span><div>{% if page.has_previous %}<a href="?{{ filters }}&{{ page_param|default:'page' }}={{ page.previous_page_number }}">上一页</a>{% endif %}　{% if page.has_next %}<a href="?{{ filters }}&{{ page_param|default:'page' }}={{ page.next_page_number }}">下一页</a>{% endif %}</div></nav>{% endif %}
