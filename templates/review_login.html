{% extends 'base.html' %}
{% block content %}
<section class="identity-card">
  <h1>评审演示</h1>
  <p>选择要体验的岗位，输入评审访问码。</p>
  {% if error %}<p class="message error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="review-account">演示岗位</label>
    <select id="review-account" name="username" required>
      <option value="">请选择岗位</option>
      {% for account, role in accounts %}<option value="{{ account.username }}">{{ role }}</option>{% endfor %}
    </select>
    <label for="review-code">评审访问码</label>
    <input id="review-code" name="review_code" type="password" required maxlength="128" autocomplete="current-password">
    <button class="button full">进入岗位工作台</button>
  </form>
  <p><a href="{% url 'access' %}">返回访问入口</a></p>
</section>
{% endblock %}
