name: PostgreSQL business checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: campus_lab
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U campus'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: campus_lab
      PGUSER: campus
      PGPASSWORD: ci-test-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test core.tests --noinput
      - run: python tools/validate_registry.py
