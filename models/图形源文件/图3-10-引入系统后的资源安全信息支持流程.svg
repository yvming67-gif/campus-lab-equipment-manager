<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1260" viewBox="0 0 1120 1260"><defs><marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#315b55"/></marker></defs><rect width="1120" height="1260" fill="#fffdf9"/><text x="560" y="30" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="19" font-weight="700" fill="#24384b">引入系统后的资源安全信息支持流程</text><rect x="28" y="52" width="164" height="54" rx="8" fill="#edf4f1" stroke="#5b857b" stroke-width="1.5"/><text x="110" y="75" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#24384b">实验室管理员</text><text x="110" y="94" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#24384b">编制人</text><line x1="110" y1="106" x2="110" y2="1180" stroke="#8a9995" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="248" y="52" width="164" height="54" rx="8" fill="#edf4f1" stroke="#5b857b" stroke-width="1.5"/><text x="330" y="75" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#24384b">资源安全信息</text><text x="330" y="94" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#24384b">系统</text><line x1="330" y1="106" x2="330" y2="1180" stroke="#8a9995" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="468" y="52" width="164" height="54" rx="8" fill="#edf4f1" stroke="#5b857b" stroke-width="1.5"/><text x="550" y="75" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#24384b">实验室管理员</text><text x="550" y="94" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#24384b">复核人</text><line x1="550" y1="106" x2="550" y2="1180" stroke="#8a9995" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="688" y="52" width="164" height="54" rx="8" fill="#edf4f1" stroke="#5b857b" stroke-width="1.5"/><text x="770" y="75" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#24384b">场地使用人</text><line x1="770" y1="106" x2="770" y2="1180" stroke="#8a9995" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="908" y="52" width="164" height="54" rx="8" fill="#edf4f1" stroke="#5b857b" stroke-width="1.5"/><text x="990" y="75" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#24384b">安全规程版本／阅读回执／</text><text x="990" y="94" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#24384b">逻辑审计记录</text><line x1="990" y1="106" x2="990" y2="1180" stroke="#8a9995" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="430" y="485" width="650" height="240" fill="none" stroke="#b36b42" stroke-width="1.6"/><rect x="430" y="485" width="650" height="28" fill="#f6eee8" stroke="#b36b42" stroke-width="1"/><text x="440" y="504" font-family="Microsoft YaHei,sans-serif" font-size="12" font-weight="700" fill="#8c4d2f">alt 复核通过 / 退回修订</text><line x1="430" y1="590" x2="1080" y2="590" stroke="#b36b42" stroke-width="1" stroke-dasharray="6 4"/><text x="440" y="530" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#8c4d2f">[通过]</text><text x="440" y="610" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#8c4d2f">[退回修订]</text><rect x="430" y="810" width="650" height="100" fill="none" stroke="#547c72" stroke-width="1.4"/><rect x="430" y="810" width="650" height="26" fill="#edf4f1" stroke="#547c72" stroke-width="1"/><text x="440" y="828" font-family="Microsoft YaHei,sans-serif" font-size="11" font-weight="700" fill="#315b55">opt 已发布、要求确认且存在未来已确认预约</text><rect x="110" y="925" width="440" height="100" fill="none" stroke="#547c72" stroke-width="1.2" stroke-dasharray="5 4"/><text x="120" y="943" font-family="Microsoft YaHei,sans-serif" font-size="10" font-weight="700" fill="#315b55">opt 复核退回</text><line x1="117" y1="145" x2="322" y2="145" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="81.5" y="96" width="276" height="31" rx="4" fill="#fffdf9"/><text x="219.5" y="109" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF01</text><text x="219.5" y="122" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">选择一个授权管理单元或具体资源范围，提交草稿及正式来源</text><line x1="337" y1="205" x2="982" y2="205" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="521.5" y="168" width="276" height="18" rx="4" fill="#fffdf9"/><text x="659.5" y="181" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF02 保存草稿并返回版本号；草稿仍仅管理人员可见</text><line x1="117" y1="265" x2="322" y2="265" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="81.5" y="228" width="276" height="18" rx="4" fill="#fffdf9"/><text x="219.5" y="241" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF02a 编制人明确请求提交该草稿复核</text><line x1="337" y1="325" x2="982" y2="325" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="521.5" y="276" width="276" height="31" rx="4" fill="#fffdf9"/><text x="659.5" y="289" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF02b 重新校验唯一范围、LabGrant、必填字</text><text x="659.5" y="302" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">段与日期，追加待审核状态和审计事实</text><line x1="337" y1="385" x2="542" y2="385" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="301.5" y="336" width="276" height="31" rx="4" fill="#fffdf9"/><text x="439.5" y="349" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF03</text><text x="439.5" y="362" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">仅向同LabGrant范围且非创建者管理员提供待审核项</text><line x1="543" y1="455" x2="338" y2="455" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="302.5" y="406" width="276" height="31" rx="4" fill="#fffdf9"/><text x="440.5" y="419" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF04 核对管理单元/资源范围和正式来源后提交决定；</text><text x="440.5" y="432" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">系统不验证来源真伪</text><line x1="337" y1="545" x2="982" y2="545" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="521.5" y="496" width="276" height="31" rx="4" fill="#fffdf9"/><text x="659.5" y="509" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF05</text><text x="659.5" y="522" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">通过：只在所选范围发布新版本；保留旧版本与确认记录</text><line x1="337" y1="625" x2="982" y2="625" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="521.5" y="588" width="276" height="18" rx="4" fill="#fffdf9"/><text x="659.5" y="601" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF06 退回：记录具体意见，当前已发布版本不变</text><line x1="337" y1="675" x2="982" y2="675" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="521.5" y="638" width="276" height="18" rx="4" fill="#fffdf9"/><text x="659.5" y="651" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF07 保存退回状态、审核责任和意见；保留原历史</text><line x1="323" y1="765" x2="118" y2="765" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="82.5" y="716" width="276" height="31" rx="4" fill="#fffdf9"/><text x="220.5" y="729" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF07a</text><text x="220.5" y="742" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">向编制人发送发布或退回结果通知；通知失败不回滚审核决定</text><line x1="337" y1="880" x2="762" y2="880" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="411.5" y="831" width="276" height="31" rx="4" fill="#fffdf9"/><text x="549.5" y="844" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF07b 仅通知受该范围影响的未来已确认预约申请人，</text><text x="549.5" y="857" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">并带预约编号；不自动取消</text><line x1="117" y1="995" x2="322" y2="995" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="81.5" y="946" width="276" height="31" rx="4" fill="#fffdf9"/><text x="219.5" y="959" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF08</text><text x="219.5" y="972" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">根据退回意见复制形成新草稿并递增版本；保留原退回事实</text><line x1="763" y1="1060" x2="338" y2="1060" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="412.5" y="1011" width="276" height="31" rx="4" fill="#fffdf9"/><text x="550.5" y="1024" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF09 查看适用于当前资源的管理单元通用及资源专属版</text><text x="550.5" y="1037" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">本；按版本确认（如要求）</text><line x1="337" y1="1110" x2="982" y2="1110" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="521.5" y="1061" width="276" height="31" rx="4" fill="#fffdf9"/><text x="659.5" y="1074" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF09a 重新校验版本仍有效且要求确认；记录用户、版</text><text x="659.5" y="1087" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">本与时间并追加审计；重复确认返回原回执</text><line x1="337" y1="1150" x2="762" y2="1150" stroke="#315b55" stroke-width="1.7" marker-end="url(#arr)"/><rect x="411.5" y="1113" width="276" height="18" rx="4" fill="#fffdf9"/><text x="549.5" y="1126" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="10" fill="#24384b">TO-SF09b 向使用人返回确认结果、规程版本及确认时间</text><text x="560" y="1170" text-anchor="middle" font-family="Microsoft YaHei,sans-serif" font-size="11" fill="#6b7470">每个版本只关联一个管理单元或具体资源；资源专属内容不向关联设备继承；正式来源和校内岗位待组织确认</text></svg>