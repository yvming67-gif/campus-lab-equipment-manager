services:
  - type: web
    name: campus-lab-demo
    runtime: python
    region: ohio
    plan: free
    buildCommand: python tools/build_cloud.py
    startCommand: python tools/start_cloud.py
    healthCheckPath: /health/
    envVars:
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: DJANGO_SETTINGS_MODULE
        value: config.cloud_settings
      - key: DEMO_MODE
        value: '1'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: MOCK_IDP_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: CAMPUS_STORAGE_BUCKET
        value: campus-lab-evidence
